# Release Temple from GitHub Actions (RELEASE.md, "Releasing from GitHub").
#
#   gh workflow run release                                 # build only, ad-hoc signed
#   gh workflow run release -f version=v0.x.y -f verify=true  # sign, notarize, package;
#                                                           # nothing tagged or published
#   gh workflow run release -f version=v0.x.y               # release
#
# The release itself is Scripts/release.sh, unchanged: the same preflight, the
# same notarization, the same tag and GitHub release a release from a Mac
# makes. This file only gives it what a Mac has: the pinned Xcode, the Ghostty
# engine, the signing identity and the notarization key.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, vX.Y.Z (`make version` prints the last). Empty: build only, ad-hoc signed, nothing published."
        required: false
        default: ""
      verify:
        description: "Sign, notarize and package the version, then stop: nothing tagged or published"
        type: boolean
        default: false
      draft:
        description: "Leave the GitHub release as a draft (the tag is pushed; run again without draft to publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Xcode the release is built with, by build number: it decides the SDK
  # the app records, and macOS picks AppKit/SwiftUI behaviour by that SDK
  # (AGENTS.md, "Two entry points"). 27A9275 is Xcode 27.1, what v0.7.0
  # shipped from. Bump it deliberately, after testing a build from the new one.
  XCODE_BUILD: 27A9275
  # The engine slice Temple ships (arm64 only; see build-ghostty.sh).
  GHOSTTY_XCFRAMEWORK_TARGET: native
  # The engine is built on the macos-15 image, the last one with an SDK that
  # zig 0.15 can link: every macOS 26+ SDK lists only arm64e in libSystem
  # (docs/BUILDING-GHOSTTY.md, gotcha 1). Xcode 26.3 does the build, as on a
  # Mac (its libtool and Metal compiler are what build-ghostty.sh's shims
  # expect), and zig links against the macOS 15 SDK of the Xcode 16.4 beside it.
  ENGINE_XCODE_BUILD: 17C529
  ENGINE_SDK_XCODE_BUILD: 16F6
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

defaults:
  run:
    shell: bash   # -eo pipefail

jobs:
  # The engine is git-ignored and slow to build, so it is cached under exactly
  # what its stamp vouches for (ghostty tag, zig, each patch's digest:
  # ADR-026), plus the slice and the Xcode and SDK that built it. The
  # xcframework and the runtime resources build-app.sh bundles come from the
  # same build, so they are cached together. GitHub drops a cache unused for
  # 7 days; the next run after that builds it again.
  engine:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Engine cache key
        id: key
        run: |
          # The stamp vouches for the inputs; the script's digest covers how
          # they are built (its shims, flags and resource handling), which the
          # stamp does not.
          stamp="$( { ./Scripts/ghostty-stamp.sh expected; shasum -a 256 Scripts/build-ghostty.sh; } | shasum -a 256 | cut -c1-16)"
          echo "key=ghostty-$stamp-$GHOSTTY_XCFRAMEWORK_TARGET-$(uname -m)-xcode$ENGINE_XCODE_BUILD-sdk$ENGINE_SDK_XCODE_BUILD" >> "$GITHUB_OUTPUT"

      - name: Look for a cached engine
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/ghostty/zig-out/share/ghostty

      - name: Select Xcode and SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          xcode_with_build() {
            local candidate build
            for candidate in /Applications/Xcode*.app; do
              [[ -L "$candidate" ]] && continue
              build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$candidate/Contents/version.plist" 2>/dev/null || true)"
              [[ "$build" == "$1" ]] && { echo "$candidate"; return 0; }
            done
            echo "::error::Xcode build $1 is not on this runner image" >&2
            return 1
          }
          xcode="$(xcode_with_build "$ENGINE_XCODE_BUILD")"
          sdk_xcode="$(xcode_with_build "$ENGINE_SDK_XCODE_BUILD")"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk=""
          for candidate in "$sdk_xcode"/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk; do
            [[ -L "$candidate" ]] || { sdk="$candidate"; break; }
          done
          [[ -n "$sdk" ]] || { echo "::error::no macOS SDK in $sdk_xcode"; exit 1; }
          echo "Engine SDK: $sdk"
          echo "GHOSTTY_SDKROOT=$sdk" >> "$GITHUB_ENV"

      - name: Build the Ghostty engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Xcode 26+ ships the Metal compiler as an optional component
          # (docs/BUILDING-GHOSTTY.md, toolchain gotcha 2).
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/build-ghostty.sh
          ./Scripts/ghostty-stamp.sh check
          [[ -d Vendor/ghostty/zig-out/share/ghostty ]] \
            || { echo "::error::the build left no Vendor/ghostty/zig-out/share/ghostty"; exit 1; }

      - name: Save the Ghostty engine
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/ghostty/zig-out/share/ghostty

  release:
    needs: engine
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write   # release.sh pushes the tag and creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags (the version preflight) and the commit count (build number)

      - name: Preflight
        id: mode
        env:
          VERSION: ${{ inputs.version }}
          VERIFY: ${{ inputs.verify }}
          HAVE_CERT: ${{ secrets.TEMPLE_DEVELOPER_ID_P12 != '' }}
          HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER != '' }}
        run: |
          if [[ -z "$VERSION" ]]; then
            [[ "$VERIFY" != true ]] || { echo "::error::verify needs a version"; exit 1; }
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "Build only, ad-hoc signed: no secret is used, nothing is tagged or published."
            exit 0
          fi
          # release.sh checks the version, the tree and origin/main itself; these
          # are what only the workflow can get wrong.
          [[ "$GITHUB_REF" == refs/heads/main ]] \
            || { echo "::error::A signed build runs from main, not $GITHUB_REF"; exit 1; }
          if [[ "$VERIFY" == true ]]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
            [[ -s "docs/releases/$VERSION.md" ]] \
              || { echo "::error::No docs/releases/$VERSION.md on main. Draft it on a Mac (make release-notes VERSION=$VERSION), read it, commit and push it, then run this again."; exit 1; }
          fi
          # Without these release.sh would still publish, ad-hoc signed and
          # unnotarized. From CI that is never what was meant.
          [[ "$HAVE_CERT" == true ]] \
            || { echo "::error::Secret TEMPLE_DEVELOPER_ID_P12 is not set (RELEASE.md, Releasing from GitHub)"; exit 1; }
          [[ "$HAVE_NOTARY" == true ]] \
            || { echo "::error::Secrets NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER are not all set"; exit 1; }

      - name: Select Xcode ${{ env.XCODE_BUILD }}
        run: |
          app=""
          for candidate in /Applications/Xcode*.app; do
            [[ -L "$candidate" ]] && continue   # Xcode.app is a symlink to one of the others
            build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$candidate/Contents/version.plist" 2>/dev/null || true)"
            if [[ "$build" == "$XCODE_BUILD" ]]; then app="$candidate"; break; fi
          done
          if [[ -z "$app" ]]; then
            echo "::error::Xcode build $XCODE_BUILD is not on this runner image. Installed:"
            for candidate in /Applications/Xcode*.app; do
              echo "  $candidate $(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$candidate/Contents/version.plist" 2>/dev/null)"
            done
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Restore the Ghostty engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/ghostty/zig-out/share/ghostty

      - name: Check the engine
        run: |
          ./Scripts/ghostty-stamp.sh check
          # build-app.sh only warns when these are missing, and the app then
          # looks for a dev checkout at runtime. A release must carry them.
          [[ -d Vendor/ghostty/zig-out/share/ghostty ]] \
            || { echo "::error::Vendor/ghostty/zig-out/share/ghostty is missing"; exit 1; }

      - name: Signing keychain
        if: steps.mode.outputs.mode != 'build'
        env:
          P12: ${{ secrets.TEMPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.TEMPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          # The preflight refused a signed run without these secrets.
          # A keychain of its own, unlocked for the job, so codesign never
          # meets the locked-keychain failure a fresh SSH session gets.
          # The runner is a throwaway VM; nothing here outlives the job.
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(uuidgen)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Both Developer ID intermediates, in case the export left them out:
          # without its issuer the identity is not valid. Certificates issued
          # before the G2 switch (like the one that signed v0.7.0) chain to
          # the original "Developer ID Certification Authority".
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$kc" || true   # already present is fine
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" >/dev/null
          # shellcheck disable=SC2046  # one argument per keychain path
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -q '"Developer ID Application' \
            || { echo "::error::the .p12 holds no valid Developer ID Application identity"; exit 1; }
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build only
        if: steps.mode.outputs.mode == 'build'
        env:
          CODE_SIGN_IDENTITY: "-"   # never the release identity, whatever secrets exist
        run: |
          ./Scripts/build-app.sh
          # The checks release.sh runs on a release build.
          ./Scripts/check-remote-code.sh dist/Temple.app
          ./Scripts/check-sdk-linkage.sh dist/Temple.app/Contents/MacOS/Temple dist/Temple.app/Contents/Helpers/temple
          ditto -c -k --keepParent dist/Temple.app dist/Temple-build.zip

      - name: ${{ inputs.verify && 'Verify' || 'Release' }} ${{ inputs.version }}
        if: steps.mode.outputs.mode != 'build'
        env:
          VERSION: ${{ inputs.version }}
          NO_PUBLISH: ${{ inputs.verify && '1' || '' }}
          DRAFT: ${{ inputs.draft && '1' || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./Scripts/release.sh
          {
            echo "### Temple $VERSION${NO_PUBLISH:+ (verify: nothing tagged or published)}"
            echo "Built with $(xcodebuild -version | tr '\n' ' ')"
            echo
            if [[ -n "${NO_PUBLISH:-}" ]]; then
              echo "dmg sha256, for inspection only (a release builds its own dmg; the cask takes the published one's):"
            else
              echo "For the Homebrew cask (RELEASE.md, Homebrew):"
            fi
            echo '```'
            shasum -a 256 dist/Temple-"$VERSION"-*.dmg
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temple-${{ inputs.version || github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: ignore
          retention-days: 14
